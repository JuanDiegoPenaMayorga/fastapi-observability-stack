groups:
  - name: fastapi_alerts
    rules:
      - alert: High5xxErrorRate
        expr: |
          (
            sum(rate(http_errors_total{status=~"5.."}[1m]))
            /
            sum(rate(http_requests_total[1m]))
          ) > 0.05
          and
          sum(rate(http_requests_total[1m])) > 0.1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "High 5xx Error Rate (> 5%)"
          description: "The 5xx error rate exceeds 5% with active traffic (current rate: {{ $value | humanizePercentage }})."
